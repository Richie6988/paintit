<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GARDP BI Hub Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — fixed rail nav on the left, sticky command bar on top, one working view at a time.
   Visual world: microbiology lab — agar-pale cool neutrals, methylene-blue accent, amber for "evidence" highlights. */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --sunken:#E4EAEF; --ink:#0D1A28; --muted:#55687B; --line:#D5DEE6;
  --accent:#1D47D6; --accent-ink:#FFFFFF; --accent-soft:#E2E8FD; --amber:#C98407; --amber-soft:#FBEFD3;
  --good:#16865A; --warn:#B7790A; --crit:#C93A31; --good-soft:#DDF2E8; --crit-soft:#F9E1DF;
  --shadow:0 1px 2px rgba(13,26,40,.06),0 8px 24px rgba(13,26,40,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08111B; --surface:#0F1B28; --sunken:#0B1520; --ink:#E4ECF4; --muted:#8C9EB2; --line:#1C2B3B;
  --accent:#7590FF; --accent-ink:#08111B; --accent-soft:#17264A; --amber:#F0B44A; --amber-soft:#3A2C10;
  --good:#3CC48A; --warn:#E8A93A; --crit:#F0675D; --good-soft:#0F3326; --crit-soft:#3D1715;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08111B; --surface:#0F1B28; --sunken:#0B1520; --ink:#E4ECF4; --muted:#8C9EB2; --line:#1C2B3B;
  --accent:#7590FF; --accent-ink:#08111B; --accent-soft:#17264A; --amber:#F0B44A; --amber-soft:#3A2C10;
  --good:#3CC48A; --warn:#E8A93A; --crit:#F0675D; --good-soft:#0F3326; --crit-soft:#3D1715;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,4.4vw,48px);line-height:1.04;font-weight:800;letter-spacing:-.025em}
h2{font-size:22px;line-height:1.2}
h3{font-size:16px}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
mark{background:var(--amber-soft);color:inherit;border-radius:3px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--amber)}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand b{font-family:var(--f-display);font-size:17px;display:block;line-height:1.1}
.brand small{font:500 10px var(--f-mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sunken);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav a svg{flex:none}
.nav .ref{margin-left:auto;font:500 10px var(--f-mono);opacity:.7}
.nav-sep{font:500 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.rail-foot{margin-top:auto;padding:12px;border:1px dashed var(--line);border-radius:var(--r);font-size:12px;color:var(--muted)}
.rail-foot b{color:var(--ink)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.cmd{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);text-align:left}
.cmd span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{font:500 11px var(--f-mono);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--sunken);color:var(--muted)}
.role{display:flex;align-items:center;gap:8px}
.role select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);max-width:190px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--surface);flex:none}
.view{padding-block:28px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1320px;width:100%;animation:rise .35s ease both}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.grid > *{min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.sm{padding:5px 10px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;background:var(--sunken);color:var(--ink);border:1px solid transparent;white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.amb{background:var(--amber-soft);color:var(--ink)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.btnlike{cursor:pointer;border-color:var(--line);background:var(--surface)}
.chip.btnlike.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.sec-head p{max-width:62ch;color:var(--muted);margin-top:6px}
table{width:100%;border-collapse:collapse}
th{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}
.bar{height:6px;border-radius:9px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .5s ease}
.empty{padding:28px;text-align:center;color:var(--muted)}
.fmt{font:600 10px var(--f-mono);padding:3px 6px;border-radius:4px;background:var(--sunken);color:var(--muted);letter-spacing:.05em}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--warn)}
input[type=text],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* home */
.hero{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:var(--surface);min-height:380px;display:grid}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero-in{position:relative;padding:40px clamp(20px,4vw,48px);display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:720px;pointer-events:none}
.hero-in > *{pointer-events:auto}
.hero-in h1 em{font-style:normal;color:var(--accent)}
.hero-in p{font-size:16px;color:var(--muted);max-width:56ch}
.askbox{display:flex;gap:8px;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);max-width:640px}
.askbox input{flex:1;min-width:0;border:0;background:transparent;padding:10px}
.askbox input:focus{box-shadow:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:16px 18px}
.kpi b{display:block;font:600 30px/1.1 var(--f-display);letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted)}
.req{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.req a{display:flex;flex-direction:column;gap:8px;padding:16px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
.req a:hover{transform:translateY(-2px);border-color:var(--accent)}
.req .eyebrow{display:flex;justify-content:space-between}
.feed li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.feed li:last-child{border-bottom:0}
.feed{list-style:none;margin:0;padding:0}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}

/* repository */
.drop{border:2px dashed var(--line);border-radius:14px;padding:28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;transition:.2s;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;min-width:280px}
.pipe span{height:6px;border-radius:4px;background:var(--sunken);position:relative;overflow:hidden}
.pipe span.done{background:var(--good)}
.pipe span.run{background:var(--accent-soft)}
.pipe span.run::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:sweep 1s linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.stage-labels{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font:500 9px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:280px}

/* knowledge */
.kgrid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}
.tree ul{list-style:none;margin:0;padding:0 0 0 14px;border-left:1px solid var(--line)}
.tree > ul{padding:0;border:0}
.tree li{margin:2px 0}
.tree .node{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;cursor:pointer}
.tree .node:hover{background:var(--sunken)}
.tree .node .n{margin-left:auto;font:500 11px var(--f-mono);color:var(--muted)}
.tree .grp{font-weight:600}
.graph-wrap{position:relative;height:520px;overflow:hidden}
.graph-wrap canvas{width:100%;height:100%;display:block;cursor:grab}
.legend{position:absolute;left:12px;bottom:12px;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;background:color-mix(in srgb,var(--surface) 88%,transparent);padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.legend span{display:flex;align-items:center;gap:5px}
.ginfo{position:absolute;right:12px;top:12px;width:260px;max-width:calc(100% - 24px);padding:14px;font-size:13px}
.cluster{display:flex;gap:14px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.cluster:last-child{border-bottom:0}
.bubble{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--f-mono);flex:none;background:var(--accent-soft);color:var(--accent)}

/* search */
.sgrid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.sbar{position:relative}
.sbar input{width:100%;font-size:17px;padding:14px 16px 14px 44px;border-radius:12px}
.sbar svg.lens{position:absolute;left:14px;top:16px;color:var(--muted)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:15;padding:6px;box-shadow:var(--shadow)}
.sugg button{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border:0;background:none;border-radius:6px;text-align:left}
.sugg button:hover,.sugg button.hl{background:var(--sunken)}
.filters{display:flex;flex-direction:column;gap:16px;position:sticky;top:84px}
.filters fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.filters legend{margin-bottom:6px}
.filters label{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.filters label .n{margin-left:auto;font:500 11px var(--f-mono);color:var(--muted)}
.result{padding:16px 18px;display:grid;gap:8px;cursor:pointer;transition:border-color .15s}
.result:hover{border-color:var(--accent)}
.result h3 a{color:inherit;text-decoration:none}
.result .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.result blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--amber);background:var(--sunken);border-radius:0 6px 6px 0;font-size:13.5px}
.rel{display:flex;align-items:center;gap:8px;font:500 11px var(--f-mono);color:var(--muted)}
.rel .bar{width:70px}
.notice{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:8px;background:var(--amber-soft);font-size:13px}

/* assistant */
.chat{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.thread{display:flex;flex-direction:column;gap:16px;min-height:420px}
.msg{display:flex;gap:12px}
.msg .av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;font:600 12px var(--f-mono)}
.msg.user .av{background:var(--sunken)}
.msg.bot .av{background:var(--accent);color:var(--accent-ink)}
.msg .body{min-width:0;flex:1}
.msg.user .bubble-t{font-weight:500}
.answer{font-size:15px;line-height:1.65}
.answer p+p{margin-top:10px}
.cite{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 4px;margin:0 1px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font:600 11px var(--f-mono);vertical-align:2px;cursor:pointer;border:0}
.cite:hover{background:var(--accent);color:var(--accent-ink)}
.steps{display:flex;flex-direction:column;gap:5px;font:12px var(--f-mono);color:var(--muted);margin-bottom:10px}
.steps div{display:flex;gap:8px;align-items:center}
.steps .ok{color:var(--good)}
.spin{width:10px;height:10px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.composer{position:sticky;bottom:12px;display:flex;flex-direction:column;gap:10px;padding:10px;box-shadow:var(--shadow)}
.composer .row input{flex:1;min-width:0;border:0;padding:10px}
.composer .row input:focus{box-shadow:none}
.evidence{position:sticky;top:84px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 100px);overflow:auto}
.src{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.src:last-child{border-bottom:0}
.src .k{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:600 11px var(--f-mono)}
.src.flash{animation:flash 1.2s ease}
@keyframes flash{0%,30%{background:var(--amber-soft)}100%{background:transparent}}
.extract{font-size:13px;padding:8px 10px;border-radius:6px;background:var(--sunken);margin-top:6px}
.gauge{display:flex;gap:14px;align-items:center}
.reasons{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.reasons li{display:flex;gap:8px;align-items:flex-start}
.reasons li::before{content:"";width:6px;height:6px;border-radius:50%;margin-top:7px;background:var(--rc,var(--good));flex:none}
.cmp th:first-child,.cmp td:first-child{width:120px;color:var(--muted)}
.exec{border:1px solid var(--line);border-radius:10px;padding:18px;background:var(--surface);display:grid;gap:12px}
.exec h4{margin:0;font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.exec ul{margin:0;padding-left:18px}

/* trust */
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.yes{color:var(--good)} .no{color:var(--muted)}
.log{font:12px/1.6 var(--f-mono);max-height:360px;overflow:auto}
.log div{display:grid;grid-template-columns:70px 120px minmax(0,1fr);gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.log div.new{animation:flash 1.5s ease}
.ctrl{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.ctrl:last-child{border-bottom:0}

/* roadmap */
.heat{display:grid;gap:3px;font-size:11px}
.heat .c{border-radius:4px;padding:8px 4px;text-align:center;font:500 11px var(--f-mono)}
.heat .h{color:var(--muted);font:500 10px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center}
.ban{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:10px;border:1px dashed var(--accent);background:var(--accent-soft);color:var(--ink);margin-bottom:18px}
.slide{aspect-ratio:16/9;max-width:100%;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:5%;display:grid;grid-template-rows:auto 1fr auto;gap:4%;box-shadow:var(--shadow)}

/* plan */
.gantt{display:grid;grid-template-columns:180px repeat(8,minmax(44px,1fr));gap:4px 3px;align-items:center;min-width:620px}
.gantt .hd{font:500 11px var(--f-mono);color:var(--muted);text-align:center}
.gantt .lb{font-size:13px;font-weight:500}
.gantt .cell{height:22px;border-radius:5px;background:var(--sunken)}
.gantt .cell.full{background:var(--accent)}
.gantt .cell.part{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 5px,color-mix(in srgb,var(--accent) 45%,transparent) 5px 10px)}
.gates{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.gate{padding:14px;position:relative}
.gate b{font:600 20px var(--f-display);color:var(--accent)}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(5,12,20,.45);z-index:50;display:flex;justify-content:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.drawer{width:min(560px,100%);height:100%;background:var(--surface);overflow:auto;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;animation:slide .25s ease}
@keyframes slide{from{transform:translateX(30px);opacity:.5}}
.palette-wrap{position:fixed;inset:0;z-index:60;background:rgba(5,12,20,.45);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 0}
.palette{width:min(620px,100%);overflow:hidden;box-shadow:var(--shadow)}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 18px;font-size:16px}
.palette input:focus{box-shadow:none}
.palette .list{max-height:50vh;overflow:auto;padding:6px}

}
function scoreText(text,qterms,sem){

}

  const res=[];
  docs.forEach(d=>{
    let best={s:0,i:0,hit:new Set()}, total=0;
    d.p.forEach((p,i)=>{const r=scoreText(p,mode==='semantic'?[]:qt,sem); if(mode==='semantic'){r.s=r.s*1.6} total+=r.s; if(r.s>best.s)best={s:r.s,i,hit:r.hit}});
    const tr=scoreText(d.title+' '+d.tags.join(' ')+' '+d.ents.join(' '),qt,sem);
    const s=best.s+total*.25+tr.s*.6;
    if(s>.5) res.push({d,score:s,pi:best.i,hit:new Set([...best.hit,...tr.hit])});
  });
  const max=Math.max(1.0,...res.map(r=>r.score), qt.length*1.6);
  res.forEach(r=>{const fresh=(new Date(r.d.date)-new Date('2024-01-01'))/(1000*3600*24*365*3); r.rel=Math.min(.99,r.score/max*.9+fresh*.08)});
  return res.sort((a,b)=>b.rel-a.rel);
}
function highlight(text,hit){
  let h=esc(text); if(!hit||!hit.size) return h;
  const parts=[...hit].filter(x=>x.length>2).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(!parts.length) return h;
  return h.replace(new RegExp('\\b('+parts.join('|')+')[a-z0-9]*','gi'),'<mark>$&</mark>');
}
function related(d,n=3){
  return visibleDocs().filter(x=>x.id!==d.id).map(x=>({x,s:x.ents.filter(e=>d.ents.includes(e)).length+x.tags.filter(t=>d.tags.includes(t)).length*.5})).filter(o=>o.s>1).sort((a,b)=>b.s-a.s).slice(0,n).map(o=>o.x);
}

/* ============================================================
   GRAPH (canvas force layout)
   ============================================================ */
function buildGraph(){
  const nodes=new Map(), links=new Map();
  visibleDocs().forEach(d=>{
    d.ents.forEach(e=>{if(!nodes.has(e))nodes.set(e,{id:e,type:ENT_TYPE[e]||'topic',docs:new Set()});nodes.get(e).docs.add(d.id)});
    for(let i=0;i<d.ents.length;i++)for(let j=i+1;j<d.ents.length;j++){const k=[d.ents[i],d.ents[j]].sort().join('|');links.set(k,(links.get(k)||0)+1)}
  });
  return {nodes:[...nodes.values()],links:[...links.entries()].map(([k,w])=>{const [a,b]=k.split('|');return{a,b,w}})};
}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function typeColor(t){return {product:css('--accent'),pathogen:css('--crit'),region:css('--good'),topic:css('--amber'),org:css('--muted')}[t]}
function startGraph(cv,{ambient=false,onSelect}={}){
  const ctx=cv.getContext('2d'); let W,H,dpr;
  const g=buildGraph(); const byId=new Map(g.nodes.map(n=>[n.id,n]));
  function size(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  size();
  const cx=()=>ambient?W*.72:W/2;
  g.nodes.forEach((n,i)=>{const a=i/g.nodes.length*Math.PI*2;n.x=cx()+Math.cos(a)*120+Math.random()*20;n.y=H/2+Math.sin(a)*120;n.vx=0;n.vy=0;n.r=4+Math.sqrt(n.docs.size)*3});
  let hover=null, sel=null, drag=null, alive=true, t=0;
  function tick(){
    const N=g.nodes;
    for(let i=0;i<N.length;i++){const a=N[i];
      for(let j=i+1;j<N.length;j++){const b=N[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01;const f=(ambient?1400:2200)/d2;const d=Math.sqrt(d2);dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}
      a.vx+=(cx()-a.x)*.004;a.vy+=(H/2-a.y)*.006;
    }
    g.links.forEach(l=>{const a=byId.get(l.a),b=byId.get(l.b);const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;const k=(d-(ambient?80:110))*.004*Math.min(3,l.w);a.vx+=dx/d*k;a.vy+=dy/d*k;b.vx-=dx/d*k;b.vy-=dy/d*k});
    N.forEach(n=>{if(n===drag)return;if(ambient&&!reduced){n.vx+=Math.sin(t*.01+n.r)*.02;n.vy+=Math.cos(t*.012+n.r)*.02}n.vx*=.86;n.vy*=.86;n.x+=n.vx;n.y+=n.vy;n.x=Math.max(n.r+4,Math.min(W-n.r-4,n.x));n.y=Math.max(n.r+4,Math.min(H-n.r-4,n.y))});
  }
  function draw(){
    t++; ctx.clearRect(0,0,W,H);
    const focus=sel||hover; const nb=new Set();
    if(focus){nb.add(focus.id);g.links.forEach(l=>{if(l.a===focus.id)nb.add(l.b);if(l.b===focus.id)nb.add(l.a)})}
    const line=css('--line'),acc=css('--accent'),ink=css('--ink'),muted=css('--muted');
    g.links.forEach(l=>{const a=byId.get(l.a),b=byId.get(l.b);const on=focus&&(l.a===focus.id||l.b===focus.id);
      ctx.strokeStyle=on?acc:line;ctx.globalAlpha=focus&&!on?.35:(ambient?.8:1);ctx.lineWidth=on?1.6:Math.min(2.5,.6+l.w*.4);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()});
    if(ambient&&!reduced){ // travelling pulses along links
      g.links.forEach((l,i)=>{if(i%3)return;const a=byId.get(l.a),b=byId.get(l.b);const k=((t*.006+i*.37)%1);ctx.globalAlpha=.9;ctx.fillStyle=acc;ctx.beginPath();ctx.arc(a.x+(b.x-a.x)*k,a.y+(b.y-a.y)*k,1.6,0,7);ctx.fill()});
    }
    g.nodes.forEach(n=>{const dim=focus&&!nb.has(n.id);ctx.globalAlpha=dim?.25:1;ctx.fillStyle=typeColor(n.type);ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,7);ctx.fill();
      if(n===focus){ctx.strokeStyle=ink;ctx.lineWidth=2;ctx.stroke()}
      const showLabel=!ambient||n.docs.size>=4||nb.has(n.id);
      if(showLabel&&(!dim)){ctx.globalAlpha=ambient?.75:1;ctx.fillStyle=ambient?muted:ink;ctx.font=`${n===focus?'600 ':''}${ambient?11:12}px "IBM Plex Sans",sans-serif`;ctx.fillText(n.id,n.x+n.r+4,n.y+4)}});
    ctx.globalAlpha=1;
  }
  let raf; function loop(){if(!alive)return;tick();draw();raf=requestAnimationFrame(loop)}
  if(reduced){for(let i=0;i<300;i++)tick();draw();}else loop();
  const pick=e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;return g.nodes.find(n=>(n.x-x)**2+(n.y-y)**2<(n.r+6)**2)};
  if(!ambient){
    cv.onpointermove=e=>{if(drag){const r=cv.getBoundingClientRect();drag.x=e.clientX-r.left;drag.y=e.clientY-r.top;drag.vx=drag.vy=0}else{hover=pick(e);cv.style.cursor=hover?'pointer':'grab'} if(reduced)draw()};
    cv.onpointerdown=e=>{drag=pick(e);if(drag)cv.setPointerCapture(e.pointerId)};
    cv.onpointerup=e=>{const n=pick(e);if(n&&n===drag){sel=sel===n?null:n;onSelect&&onSelect(sel)}drag=null;if(reduced)draw()};
    cv.onpointerleave=()=>{hover=null};
  }
  const ro=new ResizeObserver(()=>{size();if(reduced)draw()});ro.observe(cv);
  S.anim.push(()=>{alive=false;cancelAnimationFrame(raf);ro.disconnect()});
  return {select:id=>{sel=byId.get(id)||null;onSelect&&onSelect(sel)}};
}

async function runJob(i){const j=JOBS[i];j.running=true;$('#jobRows').innerHTML=JOBS.map(jobRow).join('');await sleep(1600);j.running=false;j.ok=true;j.docs=Math.ceil(Math.random()*3);j.last='Just now';audit('Ingestion',`${j.name} · manual run · ${j.docs} new`);const r=$('#jobRows');if(r){r.innerHTML=JOBS.map(jobRow).join('');$$('[data-run]').forEach(b=>b.onclick=()=>runJob(+b.dataset.run))}toast(`${j.name}: ${j.docs} document(s) ingested`)}
function guessTags(name){
  const n=name.toLowerCase(); const t=[];
  const map=[[/market|tender|price|pricing|sales/,'Market intelligence'],[/pipeline|competit/,'Competitive intelligence'],[/surveil|resist|amr/,'Epidemiology'],[/trial|clinic|protocol|site/,'Clinical'],[/regul|dossier/,'Regulatory'],[/board|strategy/,'Strategy'],[/partner/,'Partnership'],[/apac|asia|china|india|indonesia/,'Asia-Pacific'],[/africa|lagos|nigeria/,'Sub-Saharan Africa'],[/neonat|sepsis/,'Neonatal sepsis'],[/sti|gonor/,'STI Programme'],[/paed|pediat|child/,'Paediatric Formulations']];
  map.forEach(([r,tag])=>{if(r.test(n))t.push(tag)});
  if(!t.length)t.push('Programme report','Global');
  return t;
}
function ingest(files){
  if(!files.length)return;
  files.forEach(f=>{
    const prevSame=S.uploads.find(u=>u.name===f.name)||null;
    const exact=f.dup?docById(f.dup):null;
    const u={...f,id:'U'+(S.reqSeq++),stage:0,ext:(f.name.split('.').pop()||'').toUpperCase().slice(0,4),tags:f.tags||guessTags(f.name),conf:f.conf||Math.round(72+Math.random()*24),state:'run'};
    if(exact) u.dupOf=exact; else if(prevSame){u.dupOf={id:prevSame.docId||prevSame.id,title:prevSame.name};u.sim=100}
    S.uploads.unshift(u);
    advance(u);
  });
  audit('Bulk upload',`${files.length} file(s) queued`);
  renderUploads();
}
async function advance(u){
  for(let s=1;s<=6;s++){
    await sleep(380+Math.random()*520+(u.ocr&&s===2?1200:0));
    u.stage=s;
    if(s===2&&u.dupOf){u.state='dup';renderUploads();return}
    renderUploads();
  }
  finalize(u);
}
function finalize(u){
  if(u.conf<70){u.state='review';S.review.unshift({doc:null,file:u.name,field:'Project',sug:u.tags[0],alt:['Neonatal Sepsis Programme','Serious Bacterial Infections',u.tags[0]],conf:u.conf,ev:'OCR text, 1 page, handwriting detected'})}
  else u.state='ok';
  const id='D-0'+(280+DOCS.length*3);
  u.docId=id;
  const proj=u.tags.find(t=>TAXONOMY.Project.includes(t))||'Portfolio';
  DOCS.push({id,title:u.name.replace(/\.[a-z]+$/i,'').replace(/[_]+/g,' '),type:u.tags.find(t=>TAXONOMY['Type of intelligence'].includes(t))||'Programme report',project:proj,topics:u.tags.filter(t=>TAXONOMY.Topic.includes(t)),region:u.tags.find(t=>TAXONOMY.Region.includes(t))||'Global',date:new Date().toISOString().slice(0,10),source:'Internal · uploaded by you',fmt:u.ext,pages:1,v:1,access:'general',by:'You',route:'Bulk upload',ents:[],p:[`Uploaded file ${u.name}. Text extracted${u.ocr?' by OCR':''} and indexed; auto-tagged as ${u.tags.join(', ')}.`]});
  DOCS[DOCS.length-1].tags=[proj,...u.tags];
  renderUploads();
}
function renderUploads(){
  const tb=$('#upRows'); if(!tb)return;
  $('#upCard').hidden=!S.uploads.length;
  const done=S.uploads.filter(u=>u.state!=='run').length;
  $('#upSum').textContent=`${done}/${S.uploads.length} processed · ${S.uploads.filter(u=>u.state==='dup').length} duplicates · ${S.uploads.filter(u=>u.state==='review').length} to review`;
  tb.innerHTML=S.uploads.map(u=>{
    const cells=STAGES.map((_,i)=>`<span class="${i<u.stage?'done':(i===u.stage&&u.state==='run')?'run':''}"></span>`).join('');
    let res='';
    if(u.state==='run')res=`<span class="muted" style="font-size:12px">${STAGES[Math.min(u.stage,5)]}${u.ocr&&u.stage===1?' · OCR':''}…</span>`;
    else if(u.state==='dup')res=`<div style="font-size:12px;min-width:220px"><span class="chip amb">${u.sim||u.dupOf&&97}% match · ${u.sim===100?'exact duplicate (checksum)':'near duplicate'}</span><div class="muted" style="margin:4px 0">of ${esc(u.dupOf.id)} ${esc(u.dupOf.title||'')}</div><div class="row" style="gap:6px"><button class="btn sm" data-dup="${u.id}" data-act="version" type="button">Save as new version</button><button class="btn sm" data-dup="${u.id}" data-act="keep" type="button">Keep both</button><button class="btn sm" data-dup="${u.id}" data-act="discard" type="button">Discard</button></div></div>`;
    else if(u.state==='resolved')res=`<span class="chip">${esc(u.resolved)}</span>`;
    else res=`<div class="row" style="gap:4px;min-width:220px">${u.tags.slice(0,3).map(t=>`<span class="chip acc">${esc(t)}</span>`).join('')}<span class="chip ${u.state==='review'?'amb':'good'}">${u.conf}% ${u.state==='review'?'· to review queue':''}</span></div>`;
    return `<tr><td><div class="row" style="flex-wrap:nowrap"><span class="fmt">${esc(u.ext)}</span><div><div style="font-weight:500;font-size:13px;word-break:break-all">${esc(u.name)}</div><div class="muted mono" style="font-size:11px">${esc(u.size||'')}</div></div></div></td><td><div class="pipe">${cells}</div></td><td>${res}</td></tr>`;
  }).join('');
  $$('[data-dup]',tb).forEach(b=>b.onclick=()=>{
    const u=S.uploads.find(x=>x.id===b.dataset.dup); const a=b.dataset.act;
    if(a==='version'){const d=docById(u.dupOf.id);if(d){d.v++;d.date=new Date().toISOString().slice(0,10)}u.resolved=`Saved as v${d?d.v:2} of ${u.dupOf.id}`;audit('Version control',u.resolved)}
    if(a==='keep'){u.state='run';u.dupOf=null;advance(u);audit('Duplicate',`${u.name} kept as separate document`);return}
    if(a==='discard'){u.resolved='Discarded';audit('Duplicate',`${u.name} discarded`)}
    u.state='resolved';renderUploads();
  });
}

function renderThread(){

  if(!S.chat.length){t.innerHTML=`<div class="card pad" style="display:grid;gap:10px"><span class="eyebrow">How answers are built</span>
    <ol style="margin:0;padding-left:18px;display:grid;gap:4px;font-size:13.5px"><li>The question is filtered by your access rights.</li><li>Passages are retrieved (semantic and keyword) and re-ranked.</li><li>The answer is written only from those passages, with numbered citations.</li><li>A confidence score is computed from retrieval strength, source agreement and age.</li><li>If evidence is insufficient, the assistant says so and suggests documents.</li></ol>
    <p class="muted" style="font-size:12.5px">Pick a prompt below, or type your own. Switch role in the top bar to see the same question answered with fewer sources.</p></div>`;return}
  t.innerHTML=S.chat.map((m,i)=>m.who==='user'?`<div class="msg user"><div class="av">You</div><div class="body bubble-t">${esc(m.text)}</div></div>`:
    `<div class="msg bot"><div class="av">AI</div><div class="body" id="m${i}">${m.html||''}</div></div>`).join('');
  bindCites(t);
}
function bindCites(scope){$$('.cite',scope).forEach(c=>c.onclick=()=>{const s=$(`#src${c.dataset.c}`);if(s){s.scrollIntoView({block:'nearest',behavior:'smooth'});s.classList.remove('flash');void s.offsetWidth;s.classList.add('flash')}})}

function citeHTML(text){return esc(text).replace(/\[(\d)\]/g,'<button class="cite" type="button" data-c="$1">$1</button>')}

async function ask(q){
  audit('Assistant',`“${q}”`);
  S.chat.push({who:'user',text:q});
  const m={who:'bot',html:''}; S.chat.push(m);
  renderThread();
  const idx=S.chat.length-1;
  const plan=buildAnswer(q);
  const steps=[`Checking access rights · ${ROLES[S.role].label}`,`Retrieving passages · ${plan.scanned} candidates from ${visibleDocs().length} documents`,`Re-ranking · ${plan.sources.length} passage(s) kept`,plan.kind==='refuse'?'Evidence check · below threshold':'Writing answer from retrieved passages only','Scoring confidence and attaching sources'];
  const host=()=>$('#m'+idx);
  let done=[];
  for(let i=0;i<steps.length;i++){
    if(!host())return;
    host().innerHTML=`<div class="steps">${steps.map((s,j)=>j<i?`<div class="ok">${ic('check',12)} ${s}</div>`:j===i?`<div><span class="spin"></span> ${s}</div>`:'').join('')}</div>`;
    await sleep(reduced?40:300+Math.random()*250);
  }
  const stepsDone=`<details class="steps" style="margin-bottom:8px"><summary style="cursor:pointer">${ic('check',12)} ${steps.length} steps · ${(1.1+Math.random()*.8).toFixed(1)} s</summary>${steps.map(s=>`<div class="ok">${ic('check',12)} ${s}</div>`).join('')}</details>`;
  S.evidence=plan; renderEvidence();
  // stream main text
  const full=plan.text; let shown='';
  const words=full.split(/(\s+)/);
  for(let i=0;i<words.length;i++){
    shown+=words[i];
    if(i%3===0||i===words.length-1){if(!host())return;host().innerHTML=stepsDone+`<div class="answer">${shown.split('\n\n').map(p=>`<p>${citeHTML(p)}</p>`).join('')}</div>`;}
    if(i%3===0) await sleep(reduced?0:22);
  }
  m.html=stepsDone+`<div class="answer">${full.split('\n\n').map(p=>`<p>${citeHTML(p)}</p>`).join('')}</div>`+(plan.extra||'')+
    (plan.kind!=='refuse'?`<div class="row" style="margin-top:12px;gap:6px"><span class="chip ${plan.conf>=75?'good':plan.conf>=50?'amb':'crit'}"><span class="dot"></span>Confidence ${plan.conf}% · ${plan.conf>=75?'High':plan.conf>=50?'Medium':'Low'}</span><span class="chip">${plan.sources.length} source(s)</span>${plan.withheld?`<span class="chip amb">${ic('lock',12)} ${plan.withheld} withheld by access rights</span>`:''}<button class="btn ghost sm" type="button" data-fb="up">Helpful</button><button class="btn ghost sm" type="button" data-fb="down">Report an issue</button></div>`:'');
  if(host()){host().innerHTML=m.html;bindCites(host());$$('[data-fb]',host()).forEach(b=>b.onclick=()=>{audit('Feedback',b.dataset.fb==='up'?'Answer marked helpful':'Answer flagged for review');toast(b.dataset.fb==='up'?'Thanks. Feedback improves ranking.':'Flagged. A knowledge manager will review this answer.')});}
  host()&&host().scrollIntoView({block:'nearest',behavior:'smooth'});
}

function confFrom(srcs,{agree=1,coverage=1}={}){
  if(!srcs.length)return 0;
  const strength=Math.min(1,srcs.reduce((a,s)=>a+s.rel,0)/2.2);
  const newest=Math.max(...srcs.map(s=>+new Date(s.d.date)));
  const age=(Date.now()-newest)/(1000*3600*24*365);
  const fresh=Math.max(0,1-age/3);
  return Math.round(Math.min(95,(strength*.45+agree*.25+fresh*.15+coverage*.15)*100));
}
function buildAnswer(q){
  const ql=q.toLowerCase();
  const ids=(ql.match(/d-0\d{3}/g)||[]).map(x=>x.toUpperCase());
  const res=search(q,{mode:'hybrid'});
  const allRes=search(q,{mode:'hybrid',docs:DOCS});
  const withheld=allRes.filter(r=>!canSee(r.d)&&r.rel>.3).length;
  const scanned=Math.max(24,res.length*7+Math.round(Math.random()*20));
  const mk=(d,pi,rel=.9)=>({d,pi,rel});

  // Summarize a specific document
  if(/summar/.test(ql)&&ids.length){
    const d=docById(ids[0]);
    if(!d||!canSee(d))return refusal(q,scanned,withheld+(d?1:0),res,`I cannot open ${ids[0]} with your current access rights, so I will not summarise it.`);
    const s=d.p.map((p,i)=>mk(d,i,.95));
    return {kind:'sum',q,scanned,withheld,sources:s.slice(0,1),conf:91,
      text:`${d.title} (${fmtDate(d.date)}, ${d.source}) in ${d.p.length} points:\n\n`+d.p.map((p,i)=>`• ${p} [1]`).join('\n\n'),
      reasons:[['good','Single source, read in full'],['good',`Published ${fmtDate(d.date)}`],['warn','Summary only: no cross-check with other documents']],extracts:[0,1].filter(i=>d.p[i]).map(i=>({k:1,t:d.p[i]}))};
  }
  // Compare
  if(/compar/.test(ql)&&ids.length>=2){
    const a=docById(ids[0]),b=docById(ids[1]);
    if(!a||!b||!canSee(a)||!canSee(b))return refusal(q,scanned,withheld,res,'One of these documents is outside your access rights, so I cannot compare them.');
    const fig=d=>(d.p.find(p=>/%/.test(p))||d.p[0]).match(/[^.]*\d+(\.\d+)?\s?%[^.]*/)?.[0]?.trim()||d.p[0];
    const extra=`<div class="tscroll card" style="margin-top:12px"><table class="cmp"><thead><tr><th>Dimension</th><th>[1] ${esc(a.id)}</th><th>[2] ${esc(b.id)}</th></tr></thead><tbody>
      ${[['Date',fmtDate(a.date),fmtDate(b.date)],['Source',a.source,b.source],['Type',a.type,b.type],['Key figure',fig(a),fig(b)],['Main driver or caveat',a.p[a.p.length-1],b.p[b.p.length-1]]].map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>`;
    return {kind:'cmp',q,scanned,withheld,sources:[mk(a,0,.95),mk(b,0,.9)],conf:84,extra,
      text:`The two documents point in the same direction but differ in magnitude. ${a.id} is the more recent and more optimistic view [1]; ${b.id} is older and more conservative, with a different method [2]. Use the table below to compare them dimension by dimension.`,
      reasons:[['good','Both documents read in full'],['warn',`${Math.abs(new Date(a.date).getFullYear()-new Date(b.date).getFullYear())||1} year(s) between publications`],['good','Comparison dimensions are factual fields']],extracts:[{k:1,t:a.p[0]},{k:2,t:b.p[0]}]};
  }
  // RFP flagship scenario
  if(/product x/.test(ql)&&/(growth|grow|cagr|forecast|outlook|market)/.test(ql)&&/(asia|apac|pacific)/.test(ql)){
    const need=['D-0142','D-0157','D-0171','D-0163'].map(docById);
    if(need.every(canSee)){
      const s=[mk(need[0],0,.96),mk(need[1],0,.91),mk(need[2],0,.74),mk(need[3],0,.62)];
      return {kind:'ans',q,scanned,withheld,sources:s,conf:86,
        text:`Product X demand in Asia-Pacific is projected to grow by roughly 10 to 12% per year into the early 2030s.\n\nThe most recent external study forecasts a CAGR of 11.8% for 2026 to 2032, reaching about USD 412 million, with India and China representing 64% of 2032 volume [1]. GARDP's internal access modelling is consistent, at 10 to 13% per year to 2030 [2].\n\nOne older source is more conservative: hospital procurement leads interviewed in 2024 expected about 7% per year, citing budget caps [3]. The main growth driver is rising carbapenem resistance, which reached 38% of K. pneumoniae isolates in South Asia in 2025 [4]. The main downside risk is tender price referencing, which could reduce realised growth by 2 to 3 points [1].`,
        reasons:[['good','3 of 4 sources agree on 10 to 13% per year'],['good','Newest source published March 2026'],['warn','One 2024 source estimates about 7%, using a different method'],['good','All parts of the question are covered']],
        extracts:[{k:1,t:need[0].p[0]},{k:2,t:need[1].p[0]},{k:3,t:need[2].p[0]},{k:4,t:need[3].p[0]}]};
    }
    // falls through to generic composition with fewer sources
  }
  // Executive summary
  if(/executive summary|one-pager|brief/.test(ql)){
    const top=res.slice(0,4); if(!top.length||top[0].rel<.3)return refusal(q,scanned,withheld,res);
    const s=top.map(r=>mk(r.d,r.pi,r.rel));
    const subj=q.replace(/executive summary (on|of|about)?/i,'').trim()||'this topic';
    const extra=`<div class="exec" style="margin-top:12px"><div class="row" style="justify-content:space-between"><span class="eyebrow">Executive summary · GARDP format</span><span class="mono muted" style="font-size:11px">${new Date().toLocaleDateString('en-GB')}</span></div><h3>${esc(subj.charAt(0).toUpperCase()+subj.slice(1))}</h3>
      <div><h4>Key findings</h4><ul>${top.slice(0,3).map((r,i)=>`<li>${citeHTML(r.d.p[r.pi]+' ['+(i+1)+']')}</li>`).join('')}</ul></div>
      <div><h4>Implications for GARDP</h4><ul><li>Prioritise programmes where resistance growth and access gaps coincide.</li><li>Track the cited sources through saved-search alerts for new evidence.</li></ul></div>
      <div><h4>Sources</h4><p class="muted" style="font-size:12.5px">${top.map((r,i)=>`[${i+1}] ${esc(r.d.title)}, ${fmtDate(r.d.date)}`).join(' · ')}</p></div></div>`;
    return {kind:'exec',q,scanned,withheld,sources:s,conf:confFrom(s),extra,text:`Here is a one-page executive summary built from ${top.length} documents in the repository. Implications are drafted for your review; findings are taken verbatim from the cited sources.`,
      reasons:reasonsFor(s,withheld),extracts:s.map((x,i)=>({k:i+1,t:x.d.p[x.pi]}))};
  }
  // Extract insights
  if(/extract|key figures|insight/.test(ql)){
    const top=res.slice(0,5); if(!top.length||top[0].rel<.3)return refusal(q,scanned,withheld,res);
    const figs=[];top.forEach((r,i)=>r.d.p.forEach(p=>{const m=p.match(/[^.;]*\d[\d.,]*\s?(%|percent|million|billion|days|months)[^.;]*/);if(m&&figs.length<6)figs.push({t:m[0].trim(),k:i+1})}));
    const s=top.map(r=>mk(r.d,r.pi,r.rel));
    const extra=`<div class="card tscroll" style="margin-top:12px"><table><thead><tr><th>Figure or claim</th><th>Source</th></tr></thead><tbody>${figs.map(f=>`<tr><td>${esc(f.t)}</td><td><button class="cite" type="button" data-c="${f.k}">${f.k}</button></td></tr>`).join('')}</tbody></table></div>`;
    return {kind:'ins',q,scanned,withheld,sources:s,conf:confFrom(s),extra,text:`I extracted ${figs.length} figures and claims from ${top.length} relevant documents. Each one links to the passage it came from.`,reasons:reasonsFor(s,withheld),extracts:figs.slice(0,4)};
  }
  // Generic composition
  const top=res.filter(r=>r.rel>.32).slice(0,4);
  if(!top.length)return refusal(q,scanned,withheld,res);
  const s=top.map(r=>mk(r.d,r.pi,r.rel));
  const lead=top.length>1?`Based on ${top.length} documents you can access, here is what the repository says.`:'I found one relevant document. The evidence is limited.';
  const text=lead+'\n\n'+top.map((r,i)=>`${r.d.p[r.pi]} [${i+1}]`).join('\n\n')+(withheld?`\n\n${withheld} other relevant document(s) exist but are outside your access rights, so they were not used.`:'');
  return {kind:'ans',q,scanned,withheld,sources:s,conf:confFrom(s,{agree:top.length>1?.8:.4,coverage:Math.min(1,top[0].rel+.2)}),text,reasons:reasonsFor(s,withheld),extracts:s.map((x,i)=>({k:i+1,t:x.d.p[x.pi]}))};
}
function reasonsFor(s,withheld){
  const r=[];const yrs=s.map(x=>+x.d.date.slice(0,4));
  r.push([s.length>=3?'good':s.length===2?'warn':'crit',`${s.length} source(s) retrieved above the relevance threshold`]);
  r.push([Math.max(...yrs)>=2026?'good':'warn',`Newest source from ${Math.max(...yrs)}`]);
  if(Math.min(...yrs)<2025)r.push(['warn',`Oldest source from ${Math.min(...yrs)}`]);
  if(withheld)r.push(['warn',`${withheld} relevant document(s) withheld by your access rights`]);
  return r;
}
function refusal(q,scanned,withheld,res,msg){
  const sugg=res.slice(0,3);
  return {kind:'refuse',q,scanned,withheld,sources:[],conf:0,
    text:(msg||`I could not find enough evidence in the repository to answer this. Rather than guess, I am not answering.`)+(sugg.length?`\n\nThese documents may be related: ${sugg.map(r=>r.d.title).join('; ')}.`:'\n\nNo related documents were found either. You can upload a source, or rephrase the question.'),
    reasons:[['crit','No passage above the relevance threshold'],...(withheld?[['warn',`${withheld} document(s) outside your access rights`]]:[])],extracts:[]};
}
function renderEvidence(){
  const e=$('#evidence'); if(!e)return;
  const p=S.evidence;
  if(!p){e.innerHTML=`<span class="eyebrow">Evidence panel</span><p class="muted" style="font-size:13px">Sources, supporting extracts and the confidence score appear here for each answer.</p>
   <div style="opacity:.5">${gauge(0)}</div>`;return}
  const lvl=p.conf>=75?'High':p.conf>=50?'Medium':'Low';
  e.innerHTML=`
   <div><span class="eyebrow">Confidence score</span>
     <div class="gauge" style="margin-top:8px">${gauge(p.conf)}<div><b style="font:600 20px var(--f-display)">${p.kind==='refuse'?'Not answered':lvl}</b><div class="muted" style="font-size:12px">${p.kind==='refuse'?'Evidence below threshold':'retrieval · agreement · freshness'}</div></div></div>
     <ul class="reasons">${p.reasons.map(([c,t])=>`<li style="--rc:var(--${c})">${esc(t)}</li>`).join('')}</ul></div>
   <div><span class="eyebrow">Source documents used</span>
     ${p.sources.length?p.sources.map((s,i)=>`<div class="src" id="src${i+1}"><span class="k">${i+1}</span><div style="min-width:0"><a href="#" data-doc="${s.d.id}" style="color:inherit;font-weight:500;font-size:13px">${esc(s.d.title)}</a><div class="muted" style="font-size:11.5px">${fmtDate(s.d.date)} · ${esc(s.d.project)} · ${s.d.id} v${s.d.v}</div></div></div>`).join(''):'<p class="muted" style="font-size:13px;margin-top:6px">None used.</p>'}</div>
   ${p.extracts.length?`<div><span class="eyebrow">Supporting extracts</span>${p.extracts.map(x=>`<div class="extract"><button class="cite" type="button" data-c="${x.k}">${x.k}</button> “${esc(x.t)}”</div>`).join('')}</div>`:''}`;
  bindDocLinks(e); bindCites(e);
}
function gauge(v){
  const r=34,c=Math.PI*r; const col=v>=75?'var(--good)':v>=50?'var(--amber)':'var(--crit)';
  return `<svg width="88" height="52" viewBox="0 0 88 52" aria-label="Confidence ${v}%"><path d="M10 46a34 34 0 0 1 68 0" fill="none" stroke="var(--sunken)" stroke-width="8" stroke-linecap="round"/><path d="M10 46a34 34 0 0 1 68 0" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v/100)}" style="transition:stroke-dashoffset .8s ease"/><text x="44" y="44" text-anchor="middle" fill="var(--ink)" style="font:600 15px var(--f-mono)">${v}</text></svg>`;
}

function openDoc(id){
  const d=docById(id); if(!d)return;
  if(!canSee(d)){audit('Access denied',`${d.id} · ${LEVEL_LABEL[d.access]}`);toast('Access denied. This attempt was logged.');return}
  audit('Document opened',`${d.id} ${d.title}`);
  const rel=related(d,4);
  const versions=Array.from({length:d.v},(_,i)=>d.v-i);
  const sc=document.createElement('div');sc.className='scrim';
  sc.innerHTML=`<div class="drawer" role="dialog" aria-modal="true" aria-label="${esc(d.title)}">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"><div><span class="eyebrow">${d.id} · ${esc(d.type)}</span><h2 style="margin-top:6px">${esc(d.title)}</h2></div><button class="icon-btn" id="closeD" type="button" aria-label="Close">${ic('x')}</button></div>
    <div class="row" style="gap:6px">${d.tags.map(t=>`<span class="chip acc">${esc(t)}</span>`).join('')}${accessChip(d)}</div>
    <div class="card"><table><tbody>
      ${[['Source',d.source],['Published',fmtDate(d.date)],['Freshness',freshness(d.date)],['Format',`${d.fmt} · ${d.pages} page(s)`],['Ingestion route',d.route],['Uploaded by',d.by],['Checksum','sha256:'+hash(d.id)]].map(([k,v])=>`<tr><td class="muted" style="width:130px;font-size:12px">${k}</td><td style="font-size:13px">${esc(v)}</td></tr>`).join('')}
    </tbody></table></div>
    <div><span class="eyebrow">Extracted passages</span>${d.p.map(p=>`<div class="extract" style="font-size:13.5px">${esc(p)}</div>`).join('')}</div>
    <div><span class="eyebrow">Entities</span><div class="row" style="gap:6px;margin-top:6px">${d.ents.map(e=>`<span class="chip"><i class="dot" style="color:${typeColor(ENT_TYPE[e])}"></i>${esc(e)}</span>`).join('')||'<span class="muted">None extracted yet</span>'}</div></div>
    <div><span class="eyebrow">Version history</span>${versions.map((v,i)=>`<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px"><span><b class="mono">v${v}</b> ${i===0?'<span class="chip good">Current</span>':''}</span><span class="muted">${i===0?fmtDate(d.date):'Superseded, searchable on request'}</span></div>`).join('')}</div>
    ${rel.length?`<div><span class="eyebrow">Related content</span>${rel.map(x=>`<a href="#" data-doc="${x.id}" style="display:block;color:inherit;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px">${esc(x.title)}</a>`).join('')}</div>`:''}
    <div class="row"><button class="btn primary" id="askDoc" type="button">${ic('spark',14)} Summarize with the assistant</button></div>
  </div>`;
  document.body.append(sc);
  const close=()=>{sc.remove();document.removeEventListener('keydown',k)};
  const k=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',k);
  sc.onclick=e=>{if(e.target===sc)close()};
  $('#closeD',sc).onclick=close; $('#closeD',sc).focus();
  $$('[data-doc]',sc).forEach(a=>a.onclick=e=>{e.preventDefault();close();openDoc(a.dataset.doc)});
  $('#askDoc',sc).onclick=()=>{close();askFromAnywhere('Summarize '+d.id)};
}
function freshness(date){const m=(Date.now()-new Date(date))/(1000*3600*24*30);return m<6?'Fresh (under 6 months)':m<18?'Recent (6 to 18 months)':'Ageing (over 18 months): check for updates'}
function hash(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return (h>>>0).toString(16).padStart(8,'0')+'…'+((h*7)>>>0).toString(16).slice(0,4)}

      </div>
    </div>

      <div class="card pad">
        <div class="row" style="justify-content:space-between"><h3>Audit trail</h3><span class="chip"><span class="dot" style="color:var(--good)"></span>Immutable · live</span></div>
        <p class="muted" style="font-size:12.5px;margin:4px 0 10px">Your actions in this prototype appear here as you work.</p>

      <div class="card pad">

function renderLog(el){el.innerHTML=S.audit.map(a=>`<div class="${a.isNew?'new':''}"><span class="muted">${a.t}</span><span>${esc(a.action)}</span><span class="muted" style="overflow-wrap:anywhere">${esc(a.who)} · ${esc(a.detail)}</span></div>`).join('');S.audit.forEach(a=>a.isNew=false)}

  el.innerHTML=`
  <div class="ban">${ic('road',20)}<div><b>Proposal 2 preview · Future roadmap (Step 7).</b> <span class="muted">Not in the Proposal 1 scope. Shown to demonstrate that the Phase 2 extension points support these features without a rebuild.</span></div></div>
  <div class="sec-head"><div><span class="eyebrow">RFP 3.4 · Future AI capability expansion</span><h1 style="font-size:34px;margin-top:8px">From answers to foresight</h1></div>

      <div class="row" style="justify-content:space-between"><h3>Weekly intelligence digest</h3><span class="eyebrow">Wave 1</span></div>
      <p class="muted" style="font-size:12.5px;margin:4px 0 10px">Generated every Monday from saved searches and new content, with citations.</p>
      <div class="grid" style="gap:10px;font-size:13px">
        ${[['New evidence','Carbapenem resistance in K. pneumoniae reached 38% in South Asia.','D-0163'],['Competitive','Two agents against resistant A. baumannii expected to file in 2027.','D-0211'],['Policy','Antimicrobial resistance media coverage up 34% month on month.','D-0270']].map(([k,t,d])=>`<div style="padding:10px 12px;border-radius:8px;background:var(--sunken)"><span class="eyebrow">${k}</span><div style="margin-top:4px">${t} <span class="mono muted" style="font-size:11px">${d}</span></div></div>`).join('')}

function forecastSVG(p){
  const W=520,Hh=200,L=40,R=12,T=14,B=26; const yrs=[2026,2027,2028,2029,2030,2031,2032];
  const g=(.118-p/100); const base=yrs.map((_,i)=>100*Math.pow(1.118,i)); const sc=yrs.map((_,i)=>100*Math.pow(1+g,i));
  const lo=yrs.map((_,i)=>100*Math.pow(1+g-.02,i)), hi=yrs.map((_,i)=>100*Math.pow(1+g+.015,i));
  const maxY=200; const x=i=>L+i*(W-L-R)/(yrs.length-1); const y=v=>T+(Hh-T-B)*(1-(v-80)/(maxY-80));
  const line=a=>a.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const band=line(hi)+yrs.map((_,i)=>`L${x(yrs.length-1-i).toFixed(1)},${y(lo[yrs.length-1-i]).toFixed(1)}`).join('')+'Z';
  return `<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;height:auto" role="img" aria-label="Forecast index">
   ${[100,140,180].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" fill="var(--muted)" style="font:10px var(--f-mono)">${v}</text>`).join('')}
   ${yrs.map((yr,i)=>`<text x="${x(i)}" y="${Hh-8}" text-anchor="middle" fill="var(--muted)" style="font:10px var(--f-mono)">${yr}</text>`).join('')}
   <path d="${band}" fill="var(--accent)" opacity=".14"/>
   <path d="${line(base)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>
   <path d="${line(sc)}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
   <circle cx="${x(6)}" cy="${y(sc[6])}" r="4" fill="var(--accent)"/>
   <text x="${x(6)-8}" y="${y(sc[6])-10}" text-anchor="end" fill="var(--ink)" style="font:600 12px var(--f-mono)">${sc[6].toFixed(0)}</text>
   <text x="${x(6)-8}" y="${y(base[6])+16}" text-anchor="end" fill="var(--muted)" style="font:10px var(--f-mono)">base ${base[6].toFixed(0)}</text>
  </svg>`;
}

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
function openPalette(){
  if($('.palette-wrap'))return;
  const w=document.createElement('div');w.className='palette-wrap';
  w.innerHTML=`<div class="card palette" role="dialog" aria-modal="true" aria-label="Command palette"><input id="palQ" type="text" placeholder="Type a command, a question or a document" aria-label="Command"><div class="list" id="palL"></div></div>`;
  document.body.append(w);
  const inp=$('#palQ'),list=$('#palL');let hl=0,items=[];
  const close=()=>w.remove();
  const build=()=>{const v=inp.value.trim().toLowerCase();
    const nav=VIEWS.filter(x=>x.id).map(x=>({icon:x.icon,label:'Go to '+x.label,run:()=>go(x.id)}));
    const docs=visibleDocs().filter(d=>v&&d.title.toLowerCase().includes(v)).slice(0,4).map(d=>({icon:'doc',label:d.title,hint:d.id,run:()=>openDoc(d.id)}));
    items=[...(v?[{icon:'spark',label:`Ask: “${inp.value}”`,run:()=>askFromAnywhere(inp.value)},{icon:'search',label:`Search: “${inp.value}”`,run:()=>{S.query=inp.value;go('search')}}]:[]),...docs,...nav.filter(n=>!v||n.label.toLowerCase().includes(v))];
    hl=Math.min(hl,items.length-1);if(hl<0)hl=0;
    list.innerHTML=items.map((it,i)=>`<button type="button" class="${i===hl?'hl':''}" data-i="${i}">${ic(it.icon)}<span style="flex:1">${esc(it.label)}</span>${it.hint?`<span class="mono muted" style="font-size:11px">${it.hint}</span>`:''}</button>`).join('');
    $$('button',list).forEach(b=>b.onclick=()=>{close();items[+b.dataset.i].run()});
  };
  inp.oninput=()=>{hl=0;build()};
  inp.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();hl=(hl+1)%items.length;build()}else if(e.key==='ArrowUp'){e.preventDefault();hl=(hl-1+items.length)%items.length;build()}else if(e.key==='Enter'){e.preventDefault();const it=items[hl];close();it&&it.run()}else if(e.key==='Escape')close()};
  w.onclick=e=>{if(e.target===w)close()};
  build();inp.focus();
}
