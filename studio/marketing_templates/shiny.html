<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>PaintIt , transformation magique</title>
<style>
 *{margin:0;box-sizing:border-box;font-family:'Baloo 2',Inter,system-ui,Arial,sans-serif}
 body{background:#0b1226;display:flex;align-items:center;justify-content:center;min-height:100vh}
 .card{width:1200px;height:675px;background:linear-gradient(120deg,#fbfdff,#eef3fb);border-radius:24px;
   overflow:hidden;position:relative;display:flex;box-shadow:0 30px 80px rgba(0,0,0,.5)}
 .left{flex:0 0 520px;display:flex;align-items:center;justify-content:center;position:relative}
 .stage{position:relative;width:360px;height:450px;border-radius:18px;overflow:hidden;
   box-shadow:0 24px 60px rgba(18,34,79,.22);background:#fff}
 .layer{position:absolute;inset:0}
 .layer svg{width:100%;height:100%;display:block}
 .colored svg{background:#fff}
 .tpl{background:#fff;animation:reveal 4.2s ease-in-out infinite}
 .tpl svg path{stroke:#2b3040 !important}
 .tpl svg text{fill:#3a4056 !important;paint-order:stroke;stroke:#fff;stroke-width:.4px}
 .tpl svg rect{fill:#ffffff}
 @keyframes reveal{0%,40%{opacity:1}52%{opacity:0}92%{opacity:0}100%{opacity:1}}
 /* balayage lumineux magique */
 .sweep{position:absolute;top:-30%;left:-60%;width:60%;height:160%;pointer-events:none;
   background:linear-gradient(105deg,transparent,rgba(255,255,255,.9),rgba(120,200,255,.7),transparent);
   transform:skewX(-12deg);filter:blur(2px);opacity:0;animation:sweep 4.2s ease-in-out infinite}
 @keyframes sweep{0%,40%{opacity:0;left:-60%}44%{opacity:1}52%{left:120%;opacity:1}56%{opacity:0}100%{opacity:0;left:120%}}
 .sparkles{position:absolute;inset:0;pointer-events:none;overflow:visible}
 .spk{position:absolute;color:#fff;opacity:0}
 @keyframes spk{0%{opacity:0;transform:scale(.3) rotate(0)}30%{opacity:1}100%{opacity:0;transform:scale(1.4) rotate(90deg)}}
 .right{flex:1;padding:44px 44px;display:flex;flex-direction:column;justify-content:center;gap:12px}
 .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
 .brand .dot{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#33b7f5,#2f6bf2)}
 .brand b{font-size:2rem;color:#12224f} .brand b i{color:#2f6bf2;font-style:normal}
 .magic{font-size:2.6rem;line-height:1.05;color:#12224f;font-weight:800}
 .magic .em{color:#2f6bf2} .magic .g{color:#1e8848} .magic .o{color:#f0a400}
 .claim{opacity:0;transform:translateY(12px);animation:pop .5s ease forwards}
 .c1{animation-delay:2.25s}.c2{animation-delay:2.55s}.c3{animation-delay:2.85s}
 @keyframes pop{to{opacity:1;transform:none}}
 .sub{color:#5b647a;font-size:1.1rem;opacity:0;animation:pop .5s ease 3.1s forwards}
 .cta{margin-top:12px;align-self:flex-start;background:linear-gradient(120deg,#2f6bf2,#7a3ff2);color:#fff;
   font-weight:800;font-size:1.1rem;padding:13px 24px;border-radius:14px;opacity:0;animation:pop .5s ease 3.35s forwards;
   box-shadow:0 12px 30px rgba(47,107,242,.35)}
 .tag{position:absolute;top:18px;left:18px;background:#fcbc13;color:#0b1226;font-weight:800;
   padding:6px 14px;border-radius:999px;font-size:.85rem;z-index:5}
</style></head>
