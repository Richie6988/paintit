{% extends "studio/base.html" %}
{% load i18n static %}
{% block title %}{% trans "Creation en cours" %} · PaintIt{% endblock %}
{% block content %}
<section class="panel">
  <div class="loader-inline">
    <div class="art-frame">{% include "studio/_loader.html" %}</div>
    <p class="loader-title">{% trans "Nous composons votre toile..." %}</p>
    <p class="loader-sub"><span id="loadersub">{% trans "Lecture de l'image" %}&hellip;</span></p>
  </div>
</section>
<script>
  (function () {
    var uid = "{{ uid|escapejs }}";
    var sub = document.getElementById('loadersub');
    function poll() {
      fetch("{% url 'studio:gen_progress' %}?uid=" + encodeURIComponent(uid), {cache: 'no-store'})
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.error && d.error !== null && d.done && !d.pct) { window.location = "{% url 'studio:upload' %}"; return; }
          if (d.label) sub.textContent = d.label + '\u2026';
          if (d.done) {
            if (d.error) { window.location = "{% url 'studio:upload' %}"; return; }
            window.location = "{% url 'studio:gen_finalize' %}?uid=" + encodeURIComponent(uid);
            return;
          }
          setTimeout(poll, 500);
        })
        .catch(function () { setTimeout(poll, 800); });
    }
    poll();
  })();
</script>
{% endblock %}
