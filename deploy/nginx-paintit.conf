# PaintIt - nginx site config
# Cible : /etc/nginx/sites-available/paintit  (puis ln -s vers sites-enabled/)
#
# Objectif SEO : une seule origine canonique = https://paintit.click
#   - http  -> https        (301)
#   - www   -> non-www      (301)
# Ajuste le bloc upstream (socket ou port gunicorn) selon ton service systemd.

upstream paintit_app {
    # gunicorn ecoute en TCP (voir paintit.service : --bind 127.0.0.1:8000)
    server 127.0.0.1:8000 fail_timeout=0;
    # Variante socket unix (si tu passes gunicorn sur un socket) :
    # server unix:/home/paintit/Django/gunicorn.sock fail_timeout=0;
}

# 1) HTTP -> HTTPS (toutes variantes d'hote)
server {
    listen 80;
    listen [::]:80;
    server_name paintit.click www.paintit.click;
    # Laisse passer les challenges Let's Encrypt
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://paintit.click$request_uri; }
}

# 2) HTTPS www -> non-www (301)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.paintit.click;

    ssl_certificate     /etc/letsencrypt/live/paintit.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paintit.click/privkey.pem;

    return 301 https://paintit.click$request_uri;
}

# 3) HTTPS origine canonique
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paintit.click;

    ssl_certificate     /etc/letsencrypt/live/paintit.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paintit.click/privkey.pem;

    client_max_body_size 25m;   # uploads photos
    charset utf-8;

    # Fichiers statiques (collectstatic -> staticfiles/)
    location /static/ {
        alias /home/paintit/Django/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Donnees clients (adresses, photos d'origine, fichiers d'impression) : JAMAIS en direct.
    # Django les sert via /files/<uid>/<nom>?t=<signature> (fournisseurs) ou au staff.
    location ^~ /media/orders/  { return 404; }
    location ^~ /media/uploads/ { return 404; }
    location ^~ /media/gallery/ { return 404; }

    # Medias publics (assets du slider du home, etc.)
    location /media/ {
        alias /home/paintit/Django/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://paintit_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # requis par SECURE_PROXY_SSL_HEADER
        proxy_set_header X-Forwarded-Host  $host;     # requis par USE_X_FORWARDED_HOST
        proxy_redirect off;
    }
}
