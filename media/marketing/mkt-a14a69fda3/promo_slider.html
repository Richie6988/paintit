html,body{margin:0;height:100%;background:#0b1226;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card{position:relative;width:min(92vw,560px);aspect-ratio:4/5;border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);background:#fff}
.card>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
.logo{position:absolute;top:12px;left:14px;height:30px;width:auto !important;inset:auto !important;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));z-index:6}
.brandtxt{position:absolute;top:14px;left:16px;color:#fff;font-weight:900;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.6);z-index:6}
.title{position:absolute;left:16px;bottom:66px;color:#fff;font-weight:800;font-size:1.4rem;text-shadow:0 2px 8px rgba(0,0,0,.7);z-index:6}
.msg{position:absolute;left:16px;bottom:44px;right:16px;color:#eaf0ff;font-size:.95rem;text-shadow:0 2px 8px rgba(0,0,0,.7);z-index:6}
.cta{position:absolute;left:16px;bottom:14px;z-index:7;background:linear-gradient(90deg,#2f6bf2,#7a3ff2);color:#fff;font-weight:800;text-decoration:none;padding:9px 16px;border-radius:999px;box-shadow:0 6px 16px rgba(47,107,242,.45)}
.cta:hover{filter:brightness(1.08)}
.card{cursor:ew-resize;user-select:none}.top{clip-path:inset(0 var(--x,50%) 0 0)}
 .bar{position:absolute;top:0;bottom:0;left:calc(100% - var(--x,50%));width:3px;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.8);z-index:4}
 .knob{position:absolute;top:50%;left:calc(100% - var(--x,50%));transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;color:#12224f;font-weight:900;z-index:4}

</div></div><script>var c=document.querySelector('.card'),drag=false,auto=true,t=0;
function set(x){var r=c.getBoundingClientRect();var p=Math.max(0,Math.min(100,(r.right-x)/r.width*100));c.style.setProperty('--x',p+'%');}
c.addEventListener('pointerdown',function(e){drag=true;auto=false;set(e.clientX);});
window.addEventListener('pointermove',function(e){if(drag)set(e.clientX);});
window.addEventListener('pointerup',function(){drag=false;});
setInterval(function(){if(!auto)return;t+=0.02;c.style.setProperty('--x',(50+40*Math.sin(t))+'%');},33);</script></body></html>
