<style>
/* Fiche fournisseur : surcouche du design system .gx */
.sf .gx-field input[type=email],.sf .gx-field input[type=password],.sf .gx-field input[type=text],.sf .gx-field input[type=number],
.sf .gx-field input[type=url],.sf .gx-field select,.sf .gx-field textarea{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:.9rem;background:#fff;color:var(--ink)}
.sf .gx-field textarea{height:auto;padding:10px 12px}
.sf .gx-field.wide{grid-column:1/-1}
.sf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px}
.sf-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.sf-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.sf-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:4px 0 18px}
.sf-id{display:flex;align-items:center;gap:14px}
.sf-av{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.1rem}
.sf-id h1{font-size:1.6rem;font-weight:800;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sf-id p{margin:3px 0 0;color:var(--ink2);font-size:.88rem}
.sf-tabs{position:sticky;top:0;z-index:5;background:linear-gradient(#f8f9fc 70%,rgba(248,249,252,0));padding:6px 0 10px}
.sf-tabs .gx-tabs{margin:0}
.sf-tabs .gx-tabs a em{font-style:normal;font-size:.7rem;font-weight:800;background:var(--brand-50);color:var(--brand-d);border-radius:999px;padding:1px 7px;margin-left:6px}
.sf-tabs .gx-tabs a em.bad{background:var(--bad-50);color:var(--bad)}
.sf-panel{display:none}.sf-panel.on{display:block}
.sf-cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.sf-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:22px;min-width:0}
.sf-card+.sf-card{margin-top:16px}
.sf-card h2{font-size:1.02rem;font-weight:800;margin:0}
.sf-card .sub{color:var(--mute);font-size:.84rem;margin:4px 0 16px;line-height:1.5}
.sf-card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sf-alert{display:flex;gap:10px;align-items:center;justify-content:space-between;border-radius:12px;padding:11px 14px;font-size:.88rem;font-weight:600;margin-bottom:10px;border:1px solid}
.sf-alert.bad{background:var(--bad-50);border-color:#f5c9c6;color:var(--bad)}
.sf-alert.warn{background:var(--warn-50);border-color:#f6e1b0;color:var(--warn)}
.sf-alert.ok{background:var(--ok-50);border-color:#cdebd8;color:var(--ok)}
.sf-alert a{font-weight:800;text-decoration:underline !important;white-space:nowrap}
.sf-list{list-style:none;margin:0;padding:0}.sf-list li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.sf-list li:last-child{border-bottom:0}
.sf-kv{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;font-size:.88rem}.sf-kv dt{color:var(--mute);font-weight:700}.sf-kv dd{margin:0;word-break:break-word}
.sf-ch{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.sf-ch button{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:#fff;transition:border-color .15s,box-shadow .15s}
.sf-ch button:hover{border-color:#b9c9f3}
.sf-ch button.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50);background:#fbfcff}
.sf-ch b{font-size:.9rem;color:var(--ink)}.sf-ch small{font-size:.76rem;color:var(--mute);line-height:1.35}
.sf-code{font-family:ui-monospace,Menlo,monospace;font-size:.84rem;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center;word-break:break-all}
.sf-code button{all:unset;cursor:pointer;font-family:Inter,system-ui,sans-serif;font-size:.74rem;font-weight:800;color:var(--brand)}
.sf-steps{margin:0;padding-left:20px;font-size:.88rem;line-height:1.9;color:var(--ink2)}
.sf-checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.sf .sf-sw{font-weight:600}
.sf details.sf-more{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.sf details.sf-more>summary{cursor:pointer;font-weight:800;font-size:.86rem;color:var(--ink2)}
.sf pre{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px;font-size:.74rem;max-height:300px;overflow:auto}
.sf .log{width:100%;font-size:.78rem;border-collapse:collapse}.sf .log td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
@media(max-width:1000px){.sf-cols{grid-template-columns:1fr}.sf-ch{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.sf-grid,.sf-grid.three,.sf-checks{grid-template-columns:1fr}}
</style>
